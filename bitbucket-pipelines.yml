image: node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53

definitions:
  caches:
    yarn:
      key:
        files:
          - yarn.lock
      path: .temp/.yarn/berry/cache
    next-app:
      key:
        files:
          - apps/next-app/yarn.lock
      path: apps/next-app/node_modules
    unplugged:
      key:
        files:
          - packages/unplugged/yarn.lock
      path: packages/unplugged/node_modules
  conditions:
    - condition: &html-ui-changed
        changesets:
          includePaths:
            - package.json
            - packages/commons/**
            - packages/stylelint-config/**
            - packages/html-ui/**
    - condition: &react-ui-changed
        changesets:
          includePaths:
            - package.json
            - packages/commons/**
            - packages/stylelint-config/**
            - packages/html-ui/**
            - packages/react-ui/**
  scripts:
    - script: &git-auth |
        if [[ "$CI_BOT_USER_EMAIL" ]]; then
          git remote set-url origin https://${CI_BOT_USER_ID}:${CI_BOT_USER_TOKEN}@bitbucket.org/${BITBUCKET_REPO_FULL_NAME}.git
          git config user.email $CI_BOT_USER_EMAIL
        else
          git remote set-url origin https://x-token-auth:${CI_BOT_USER_TOKEN}@bitbucket.org/${BITBUCKET_REPO_FULL_NAME}.git
          git config user.email ${CI_BOT_USER_ID}@bots.bitbucket.org
        fi
    - script: &env |
        export YARN_GLOBAL_FOLDER=.temp/.yarn/berry
        echo "YARN_GLOBAL_FOLDER=$YARN_GLOBAL_FOLDER" >> .env
    - script: &setup |
        nvm install $NODE_VERSION
        corepack enable
        yarn install
    - script: &lint |
        set +e
        if [ "$WORKSPACE" ]; then
          yarn $WORKSPACE turbo run lint -- -f bitbucket
          REPORT_STATUS=$?
        else
          yarn turbo run //#lint -- -f bitbucket
          REPORT_STATUS=$?
        fi
        set -e
    - script: &test |
        yarn $WORKSPACE turbo run coverage
    - script: &test-runner |
        set -o pipefail
        npx concurrently -k -s first -n "SB,TEST" "yarn $WORKSPACE turbo run start -- --silent" "npx wait-on $(yarn $WORKSPACE g:dotenv-get SB_URL | tail -n1) && yarn $WORKSPACE coverage"
    - script: &chromatic |
        if [[ "$BITBUCKET_BRANCH" == main || "$BITBUCKET_BRANCH" == release* ]]; then
          yarn $WORKSPACE turbo run build-storybook
          yarn $WORKSPACE chromatic --auto-accept-changes --zip
        else
          yarn $WORKSPACE turbo run chromatic -- --zip
        fi
    - script: &report |
        curl --request PUT "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_FULL_NAME}/commit/${BITBUCKET_COMMIT}/reports/${PACKAGE_NAME}/" \
          --header "Authorization: Bearer $CI_REPO_TOKEN" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --data @${WORKSPACE:-.}/bitbucket-report.json \
          --fail-with-body
        ANNOTATIONS_FILE="${WORKSPACE:-.}/bitbucket-annotations.json"
        if [[ $(cat ${ANNOTATIONS_FILE} | jq 'length') > 0 ]]; then
          curl --request POST \
            --url "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_FULL_NAME}/commit/${BITBUCKET_COMMIT}/reports/${PACKAGE_NAME}/annotations/" \
            --header "Authorization: Bearer $CI_REPO_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data @${ANNOTATIONS_FILE} \
            --fail-with-body
        fi
        [ ${REPORT_STATUS:-0} = 0 ] && true || exit $REPORT_STATUS
    - script: &release |
        if [[ -z "$REF_NAME" ]]; then
          REF_NAME="$BITBUCKET_BRANCH"
        fi

        if [ "$RELEASE_TAGS" ]; then
          RELEASE_TAG=$( echo "$RELEASE_TAGS" | jq -r --arg keyvar "$BITBUCKET_BRANCH" --arg tag "$RELEASE_TAG" '.[$keyvar] // $tag' )
        fi

        if [ "$RELEASE_TAG" == "{branch}" ]; then
          RELEASE_TAG="$REF_NAME"
        fi

        RELEASE_TAG=$(echo "$RELEASE_TAG" | sed 's/\//_/g')

        export BASE_REF="HEAD"
        if [[ "$STABLE" = true && "$BASE_REF_NAME" ]]; then
          BASE_REF="$BASE_REF_NAME"
        elif [[ "$REF_NAME" == issue/cherry-pick-* || "$REF_NAME" == patch/cherry-pick-* || "$REF_NAME" == feature/cherry-pick-* || "$REF_NAME" == minor/cherry-pick-* || "$REF_NAME" == prepare/cherry-pick-* ]]; then
          PARTS=(${REF_NAME//-/ })
          COUNT=${#PARTS[@]}
          COUNT=$((COUNT - 2))
          BASE_REF+="~$COUNT"
        elif [[ "$BITBUCKET_PR_DESTINATION_BRANCH" ]]; then
          BASE_REF=origin/$BITBUCKET_PR_DESTINATION_BRANCH
        else
          BASE_REF+="~1"
        fi

        if [ "$BASE_REF" ]; then
          echo BASE_REF="$BASE_REF" >> .env
        fi

        SEMVER=$(yarn apply-versions --strategy $RELEASE_STRATEGY)
        if [[ "$SEMVER" != "{}" ]]; then
          echo $SEMVER
          yarn build
        fi

        if [[ "$RELEASE_STRATEGY" != "build" ]]; then
          message="[skip ci] [DEV] Stable release"
          if [[ "$RELEASE_STRATEGY" == "launch" ]]; then
            message="[DEV] Launch release"
          fi
          git add .
          git commit -m "$message" || true
        fi

        if [ "$RELEASE_TAG" ]; then
          AUTO_RELEASE_TAG=false
          if [[ "$SEMVER" != "{}" ]] && {
            [[ "$REF_NAME" == main || "$REF_NAME" == release* ]] ||
              { [[ -n "$RELEASE_TAGS" ]] && jq -e --arg keyvar "$REF_NAME" 'has($keyvar)' <<< "$RELEASE_TAGS" > /dev/null; };
          }; then
            AUTO_RELEASE_TAG=true
          fi

          if [[ "$RELEASE_STRATEGY" == launch || "$AUTO_RELEASE_TAG" == true ]]; then
            if git show-ref -q --verify "refs/tags/$RELEASE_TAG"; then
              git tag -d "$RELEASE_TAG"
              git push -d origin "$RELEASE_TAG"
            fi
            git tag "$RELEASE_TAG" -am "$SEMVER"
            if [[ "$RELEASE_STRATEGY" == launch ]]; then
              git push --atomic origin "$REF_NAME" "$RELEASE_TAG"
            else
              git push origin "$RELEASE_TAG"
            fi
          fi

          if [[ "$AUTO_RELEASE_TAG" == true && "$NPM_PUBLISH" == "true" ]]; then
            echo "$SEMVER" | jq -c 'to_entries | .[]' | while read entry; do
              name=$(echo $entry | jq -r '.key')
              version=$(echo $entry | jq -r '.value')
              npm unpublish $name@$version
            done
          fi
        fi

        if [[ "$SEMVER" != "{}" && "$NPM_PUBLISH" == "true" ]]; then
          yarn workspaces foreach -A --no-private npm publish --tolerate-republish ${RELEASE_TAG:+--tag $RELEASE_TAG}
        fi
pipelines:
  default:
    - step: &publish
        name: Release
        type: pipeline
        custom: release
        script:
          - echo "Publishing..."
  branches:
    '{main,release*}':
      - parallel:
          - step: &code-report
              name: Code Report
              type: pipeline
              custom: code-report
              script:
                - echo "Running Code Report..."
          - step: &deploy
              name: Deploy
              type: pipeline
              custom: deploy
              script:
                - echo "Deploying..."
          - step: *publish
  pull-requests:
    '**':
      - step:
          name: Prepare Version Strategy
          image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
          max-time: 15
          size: 2x
          caches:
            - yarn
            - next-app
            - unplugged
          clone:
            enabled: true
            depth: 75
          script:
            - '[[ "$BITBUCKET_PR_DESTINATION_BRANCH" != release* ]] && exit 0 || true'
            - *env
            - git fetch --depth=1 origin $BITBUCKET_PR_DESTINATION_BRANCH
            - echo "BASE_REF=origin/$BITBUCKET_PR_DESTINATION_BRANCH" >> .env
            - nvm install $NODE_VERSION
            - corepack enable
            - |
              set +e
              yarn version check
              REPORT_STATUS=$?
              set -e
            - '[ $REPORT_STATUS = 0 ] && exit 0 || true'
            - >-
              [[ "$BITBUCKET_BRANCH" != issue/* && "$BITBUCKET_BRANCH" != patch/* && "$BITBUCKET_BRANCH" !=
              feature/* && "$BITBUCKET_BRANCH" != minor/* ]] && exit 1 || true
            - >-
              export APPLY_STRATEGY=$( [[ "$BITBUCKET_BRANCH" == issue/* || "$BITBUCKET_BRANCH" == patch/* ]] &&
              echo "patch" || echo "minor" )
            - *git-auth
            - git fetch --depth=1 origin $BITBUCKET_PR_DESTINATION_BRANCH
            - echo "BASE_REF=origin/$BITBUCKET_PR_DESTINATION_BRANCH" >> .env
            - yarn install
            - rm -rf .yarn/versions || true
            - export SEMVER=$( yarn apply-versions --strategy $APPLY_STRATEGY )
            - git stash
            - |
              if [[ "$SEMVER" && "$SEMVER" != "{}" ]]; then
                yarn workspaces foreach -A --no-private exec 'test $(echo $SEMVER | jq .\"$npm_package_name\") = null || yarn version $APPLY_STRATEGY --deferred'
                git add .
                git commit -m "[DEV] Add Version Strategy"
                git push
              fi
      - parallel:
          - step: *code-report
          - step: *deploy
  custom:
    code-report:
      - step:
          name: Lint and Test Root
          image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
          max-time: 10
          size: 2x
          caches:
            - yarn
          script:
            - *env
            - export PACKAGE_NAME=vite-storybook-boilerplate
            - export YARN_AFTER_INSTALL=''
            - *setup
            - curl -sSL https://aka.ms/apm-unix | sh -s -- --prefix /usr/local
            - apm install --frozen
            - apm audit --ci --no-cache
            - *lint
            - *report
      - parallel:
          - step:
              name: Lint and Test Commons
              image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
              max-time: 10
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - package.json
                    - packages/commons/**
              caches:
                - yarn
              script:
                - *env
                - WORKSPACE=packages/commons
                - PACKAGE_NAME=commons
                - export YARN_AFTER_INSTALL=''
                - *setup
                - *lint
                - *test
                - *report
          - step:
              name: Lint and Test Stylelint Config
              image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
              max-time: 10
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - *env
                    - package.json
                    - packages/commons/**
                    - packages/stylelint-config/**
              caches:
                - yarn
              script:
                - *env
                - WORKSPACE=packages/stylelint-config
                - PACKAGE_NAME=stylelint-config
                - export YARN_AFTER_INSTALL=''
                - *setup
                - *lint
                - *test
                - *report
          - step:
              name: Lint and Test HTML UI
              image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
              max-time: 10
              size: 2x
              caches:
                - yarn
              clone:
                enabled: true
                depth: 75
              condition: *html-ui-changed
              script:
                - *env
                - WORKSPACE=packages/html-ui
                - PACKAGE_NAME=html-ui
                - export YARN_AFTER_INSTALL=''
                - *setup
                - yarn playwright install --with-deps chromium
                - *lint
                - *test-runner
                - *report
          - step:
              name: Lint and Test React UI
              image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
              max-time: 10
              size: 2x
              caches:
                - yarn
              clone:
                enabled: true
                depth: 75
              condition: *react-ui-changed
              script:
                - *env
                - WORKSPACE=packages/react-ui
                - PACKAGE_NAME=react-ui
                - export YARN_AFTER_INSTALL=''
                - *setup
                - yarn playwright install --with-deps chromium
                - *lint
                - *test
                - *report
          - step:
              name: Lint and Test Next App
              max-time: 15
              size: 2x
              caches:
                - yarn
                - next-app
              condition:
                changesets:
                  includePaths:
                    - package.json
                    - packages/commons/**
                    - packages/html-ui/**
                    - packages/react-ui/**
                    - apps/next-app/**
              script:
                - *env
                - WORKSPACE=apps/next-app
                - PACKAGE_NAME=next-app
                - yarn install
                - yarn $WORKSPACE turbo run lint
          - step:
              name: Lint and Test Svelte App
              image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
              max-time: 15
              size: 2x
              caches:
                - yarn
                - unplugged
              condition:
                changesets:
                  includePaths:
                    - package.json
                    - bin/bootstrap.ts
                    - packages/commons/**
                    - packages/html-ui/**
                    - apps/svelte-app/**
              script:
                - *env
                - WORKSPACE=apps/svelte-app
                - PACKAGE_NAME=svelte-app
                - *setup
                - *lint
                - *test
                - *report
    deploy:
      - step:
          name: Deploy HTML UI
          image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
          max-time: 6
          size: 2x
          caches:
            - yarn
          condition: *html-ui-changed
          script:
            - *env
            - WORKSPACE=packages/html-ui
            - PACKAGE_NAME=html-ui
            - export YARN_AFTER_INSTALL=''
            - *setup
            - *chromatic
      - step:
          name: Deploy React UI
          image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
          max-time: 6
          size: 2x
          caches:
            - yarn
          condition: *react-ui-changed
          script:
            - *env
            - WORKSPACE=packages/react-ui
            - PACKAGE_NAME=react-ui
            - export YARN_AFTER_INSTALL=''
            - *setup
            - *chromatic
    release:
      - step:
          name: Release
          image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
          max-time: 25
          size: 2x
          caches:
            - yarn
            - next-app
            - unplugged
          clone:
            enabled: true
            depth: full
          condition:
            changesets:
              includePaths:
                - .yarn/versions/**
                - apps/**
                - packages/**
          script:
            - *env
            - >-
              STABLE=$( [[ "$BITBUCKET_BRANCH" == release* ]] && echo
              "true" || echo "false" )
            - >-
              RELEASE_STRATEGY=$( [ "$STABLE" = true ] && echo "stable" || echo
                "build" )
            - *git-auth
            - |
              if [ "$STABLE" = true ]; then
                git fetch --depth=50 origin "$BASE_REF_NAME:$BASE_REF_NAME"
              fi
            - *setup
            - *release
            - '[ "$STABLE" = true ] && git push || true'
    launch:
      - variables:
          - name: REF_NAME
            description: The branch name you wish to create for the release
            default: release/
          - name: NEXT_VERSION
            description: The version strategy for the current (e.g. development) branch
            default: env_VERSION_STRATEGY
            allowed-values:
              - env_VERSION_STRATEGY
              - patch
              - minor
              - major
      - step:
          name: Create new releases
          image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
          max-time: 15
          size: 2x
          caches:
            - yarn
            - next-app
            - unplugged
          clone:
            enabled: true
            depth: full
          script:
            - *env
            - STABLE=true
            - RELEASE_STRATEGY=launch
            - BASE_REF_NAME=$(git branch --show-current)
            - *git-auth
            - *setup
            - *release
            - git checkout -b $REF_NAME
            - git push --set-upstream origin $REF_NAME
            - |
              if [[ "$NEXT_VERSION" == "env_VERSION_STRATEGY" ]]; then
                NEXT_VERSION=$VERSION_STRATEGY
              fi
            - |
              if [[ "$NEXT_VERSION" != "none" ]]; then
                git checkout $BASE_REF_NAME
                yarn workspaces foreach -A --no-private version --deferred $NEXT_VERSION
                git add .
                git commit -m "[DEV] Add Version Strategy"
                git push
              fi
    prepare:
      - variables:
          - name: COMMITS
            description:
              One or more commits that you wish to cherry-pick into the target
              branch
          - name: REF_NAME
            description: The branch name prefix you wish to create for the cherry-pick
            default: prepare/
            allowed-values:
              - issue/
              - patch/
              - feature/
              - minor/
              - prepare/
      - step:
          name: Create a PR with cherry-picked commits
          image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
          max-time: 15
          clone:
            enabled: true
            depth: 75
          script:
            - *env
            - *git-auth
            - BASE_REF_NAME=$(git branch --show-current)
            - |
              source ./bin/git-ls-unmerged.sh
              SHORT=$OUTPUT
            - export BASE_REF=${REF_NAME}cherry-pick-${SHORT}
            - '[ ! $REF ] && exit 1 || true'
            - git fetch --depth=2 origin $REF
            - git cherry-pick -x $REF || true
            - git add .
            - git cherry-pick --continue || true
            - git checkout -b $BASE_REF
            - git push -u origin $BASE_REF
            - >-
              curl 
              https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_FULL_NAME}/pullrequests \
                --header "Authorization: Bearer $CI_REPO_TOKEN" \
                --request POST \
                --header \
                  "Content-Type: application/json" --data "{
                    \"title\": \"Cherry Pick ${SHORT//-/ } into $BASE_REF_NAME\",
                    \"source\": {
                      \"branch\": {
                        \"name\": \"$BASE_REF\"
                      }
                    },
                    \"destination\": {
                      \"branch\": {
                        \"name\": \"$BASE_REF_NAME\"
                      }
                    },
                    \"reviewers\": [
                      {
                        \"uuid\": \"$BITBUCKET_STEP_TRIGGERER_UUID\"
                      }
                    ],
                    \"close_source_branch\": true
                  }" \
                --fail-with-body
    renovate:
      - step:
          image: renovate/renovate:latest@sha256:46debe9b6caa2cb967e6d8599d5f8ac135fd4662f3ec1c8a24e0e4f41b3dd577
          size: 2x
          caches:
            - yarn
          script:
            - *env
            - set -o pipefail
            - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
            - set +e
            - . ~/.nvm/nvm.sh
            - REPORT_STATUS=$?
            - set -e
            - '[ $REPORT_STATUS != 0 ] && exit $REPORT_STATUS || true'
            - *setup
            - yarn run-script renovate.config.ts > renovate.config.json
            - export LOG_LEVEL=debug
            - export RENOVATE_PLATFORM=bitbucket
            - export RENOVATE_CONFIG_FILE=renovate.config.json
            - export RENOVATE_REPOSITORIES=${BITBUCKET_REPO_FULL_NAME}
            - export YARN_ENABLE_IMMUTABLE_INSTALLS=false
            - renovate
    cert:
      - variables:
          - name: FORCE
            description: Generate and publish a new certificate immediately.
            default: 'false'
            allowed-values:
              - 'true'
              - 'false'
          - name: CERT_PATH
            description: Certificate output path.
            default: cert/dev-cert.pem
          - name: KEY_PATH
            description: Private key output path.
            default: cert/dev-key.pem
          - name: CERT_DAYS
            description: Certificate validity in days.
            default: '3653'
          - name: CERT_SUBJECT
            description: Certificate subject.
            default: /CN=localhost
          - name: CERT_SAN
            description: Subject alternative names.
            default: DNS:localhost,IP:127.0.0.1,IP:::1
          - name: CERT_KEY_TYPE
            description: OpenSSL key type and size.
            default: rsa:2048
      - step:
          name: Renew Certificate
          image: atlassian/default-image:5@sha256:71fab98cf1691e17ca5dd59b5ce8356110a3f18854f58a729c220eca36a83e3d
          max-time: 5
          script:
            - *git-auth
            - |
              set -euo pipefail

              cert_path="${CERT_PATH:-cert/dev-cert.pem}"
              key_path="${KEY_PATH:-cert/dev-key.pem}"
              renewal_window=$((30 * 24 * 60 * 60))
              force_renewal="${FORCE:-false}"
              renew=true

              if [[ "$force_renewal" != 'true' && -s "$cert_path" && -s "$key_path" ]]; then
                cert_hash=$(openssl x509 -noout -modulus -in "$cert_path" 2>/dev/null | openssl sha256 | awk '{print $2}')
                key_hash=$(openssl rsa -noout -modulus -in "$key_path" 2>/dev/null | openssl sha256 | awk '{print $2}')
                expiry_text=$(openssl x509 -enddate -noout -in "$cert_path" 2>/dev/null || true)

                if [[ -n "$cert_hash" && "$cert_hash" == "$key_hash" && -n "$expiry_text" ]]; then
                  if expiry=$(date -d "${expiry_text#*=}" +%s 2>/dev/null); then
                    if (( expiry - $(date +%s) > renewal_window )); then
                      renew=false
                    fi
                  fi
                fi
              fi

              if [[ "$renew" != true ]]; then
                echo "Certificate is not due for renewal."
                exit 0
              fi

              CERT_PATH="$cert_path" \
              KEY_PATH="$key_path" \
              CERT_DAYS="${CERT_DAYS:-3653}" \
              CERT_SUBJECT="${CERT_SUBJECT:-/CN=localhost}" \
              CERT_SAN="${CERT_SAN:-DNS:localhost,IP:127.0.0.1,IP:::1}" \
              CERT_KEY_TYPE="${CERT_KEY_TYPE:-rsa:2048}" \
                ./bin/generate-cert.sh

              git add "$cert_path" "$key_path"
              git commit -m '[DEV] Renew Development Certificate'
              git push
