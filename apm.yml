name: vite-storybook-boilerplate
version: 0.0.0
targets:
  - claude
  - codex
  - copilot
  - cursor
includes: auto
dependencies:
  require_pinned_constraint: true
  apm: []
  mcp:
    - name: react-ui:local
      registry: false
      transport: http
      url: http://localhost:6007/mcp
    - name: next-devtools-mcp
      registry: false
      transport: stdio
      command: yarn
      args:
        - workspace
        - next-app
        - next-devtools-mcp
    - name: svelte-mcp
      registry: false
      transport: stdio
      command: yarn
      args:
        - workspace
        - svelte-app
        - svelte-mcp
