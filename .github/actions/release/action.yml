name: Release
description: Create a release commit and publish

inputs:
  strategy:
    default: build
    description: The version strategy to run
  tag:
    default: ''
    description: The distribute tag
  push_tag:
    default: 'true'
    description: If "true", tag is pushed when there is a new version
  dry_run_publish:
    description: If "true", publish is disabled
  npm_registry_url:
    description: The NPM publish registry URL
  npm_auth_token:
    description: The NPM authentication token

runs:
  using: 'composite'
  steps:
    - name: Apply versions
      id: versions
      env:
        STRATEGY: ${{ inputs.strategy }}
      run: echo "semver=$(yarn apply-versions --strategy="$STRATEGY")" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Build
      if: steps.versions.outputs.semver != '{}'
      env:
        SEMVER: ${{ steps.versions.outputs.semver }}
      run: |
        printf '%s\n' "$SEMVER"
        yarn turbo run build
      shell: bash
    - name: Prepare commit
      if: inputs.strategy != '' && inputs.strategy != 'build'
      env:
        STRATEGY: ${{ inputs.strategy }}
      run: |
        git add .
        git commit -m "chore(version): $STRATEGY release" || true
      shell: bash
    - name: Tag the HEAD
      if: inputs.push_tag == 'true' && inputs.tag != '' && steps.versions.outputs.semver != '{}'
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        SEMVER: ${{ steps.versions.outputs.semver }}
      run: |
        git check-ref-format "refs/tags/$RELEASE_TAG"
        git tag -d -- "$RELEASE_TAG" || true
        git push --delete origin "refs/tags/$RELEASE_TAG" || true
        git tag -a -m "$SEMVER" -- "$RELEASE_TAG"
        git push origin "refs/tags/$RELEASE_TAG"
        git push
      shell: bash
    - name: Publish
      if: inputs.tag != ''
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        NPM_REGISTRY_URL: ${{ inputs.npm_registry_url }}
        NPM_AUTH_TOKEN: ${{ inputs.npm_auth_token }}
      run: >-
        yarn workspaces foreach -A --no-private ${{ inputs.dry_run_publish != '' && '-n' || '' }}
        npm publish --tolerate-republish --tag "$RELEASE_TAG"
      shell: bash
