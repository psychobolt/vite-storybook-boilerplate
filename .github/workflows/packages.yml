name: Packages

on:
  workflow_call:
    inputs:
      ref:
        type: string
      package_names:
        type: string
        required: true
      force:
        type: boolean
      release:
        type: string
    outputs:
      release:
        value: 'true'

jobs:
  html-ui:
    uses: ./.github/workflows/package.yml
    permissions: &package_permissions
      contents: read
      deployments: write
      issues: write
      packages: write
      pull-requests: write
    if: inputs.force || contains(fromJSON(inputs.package_names), 'html-ui')
    with:
      ref: ${{ inputs.ref }}
      workspace: html-ui
      path: packages/html-ui
      release: ${{ inputs.release }}
    secrets: inherit

  react-ui:
    if: inputs.force || contains(fromJSON(inputs.package_names), 'react-ui')
    uses: ./.github/workflows/package.yml
    permissions: *package_permissions
    with:
      ref: ${{ inputs.ref }}
      workspace: react-ui
      path: packages/react-ui
      release: ${{ inputs.release }}
    secrets: inherit
