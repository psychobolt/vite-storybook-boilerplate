on:
  schedule:
    # The "*" (#42, asterisk) character has special semantics in YAML, so this
    # string has to be quoted.
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC

permissions:
  contents: read

jobs:
  next:
    uses: ./.github/workflows/sync.yml
    permissions:
      contents: read
    with:
      ref_name: next
    secrets: inherit
