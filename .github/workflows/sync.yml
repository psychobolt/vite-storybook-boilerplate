name: Sync Lastest Changes

on:
  workflow_call:
    inputs:
      ref_name:
        type: string
        default: main
      base_url:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref_name:
        type: string
        default: main
      base_url:
        type: string
        default: ''

concurrency:
  group: sync-${{ inputs.ref_name}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TURBO_VERBOSITY: ${{ vars.TURBO_VERBOSITY || 0 }}
      TURBO_ENV_MODE: ${{ vars.TURBO_ENV_MODE || 'strict' }}
      TURBO_TELEMETRY_DISABLED: 1
      YARN_CHECKSUM_BEHAVIOR: update
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
      - name: Get GitHub App User ID
        id: get_user_id
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.get_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Configure git
        run: |
          git config --global user.name ${{ steps.get_token.outputs.app-slug }}[bot]
          git config --global user.email ${{ steps.get_user_id.outputs.user-id }}+${{ steps.get_token.outputs.app-slug }}[bot]@users.noreply.github.com
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.get_token.outputs.token }}
          ref: ${{ inputs.ref_name }}
      - name: Set Yarn global folder
        env:
          YARN_GLOBAL_FOLDER: ${{ runner.temp }}/.yarn/berry
        run: echo "YARN_GLOBAL_FOLDER=$YARN_GLOBAL_FOLDER" >> .env
      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: '**/yarn.lock'
      - name: Merge with base branch
        run: |
          git remote add base "${{ inputs.base_url || format('{0}/{1}', github.server_url, github.repository) }}"
          git fetch base main
          merge_status=0
          if git merge-base HEAD base/main >/dev/null 2>&1; then
            git merge base/main --no-commit --ff || merge_status=$?
          else
            git merge base/main --allow-unrelated-histories --squash || merge_status=$?
          fi
          deleted_paths=$(git status | awk '/deleted by us/ {print $4}')
          if [[ -n "$deleted_paths" ]]; then
            printf '%s\n' "$deleted_paths" | xargs -r git rm --
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          if [[ -n "$conflicts" ]]; then
            echo "::error::The sync merge left unresolved conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          if [[ "$merge_status" -ne 0 && -z "$deleted_paths" ]]; then
            unexpected_deleted_paths=$(git status --short | awk 'substr($0, 1, 2) ~ /D/ {print substr($0, 4)}')
            echo "::error::The sync merge failed (status $merge_status)."
            if [[ -n "$unexpected_deleted_paths" ]]; then
              echo "::error::Unexpected deleted files requiring review:"
              printf '%s\n' "$unexpected_deleted_paths"
            else
              echo "::error::Inspect the merge output above for the cause."
            fi
            exit "$merge_status"
          fi
      - name: Start Turbo Cache Server
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: ${{ vars.TURBO_CACHE_PREFIX }}
      - name: Install dependencies
        run: |
          yarn install
          yarn bootstrap
      - name: Amend Merge
        run: |
          if ! git diff-index --quiet HEAD; then
            git add .
            git commit --no-edit
          fi
      - name: Update ${{ inputs.ref_name }} branch
        run: git push origin
