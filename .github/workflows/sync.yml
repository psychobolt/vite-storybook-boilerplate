name: Sync Latest Changes

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref_name:
        type: string
        required: true
      base_url:
        type: string
        default: ''
      mirror:
        type: boolean
        default: false

concurrency:
  group: sync-${{ inputs.ref_name || vars.FORK_REF_NAME }}
  cancel-in-progress: true

env:
  REF_NAME: ${{ inputs.ref_name || vars.FORK_REF_NAME }}

permissions:
  contents: read

jobs:
  sync:
    if: inputs.ref_name || vars.FORK_REF_NAME
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TURBO_VERBOSITY: ${{ vars.TURBO_VERBOSITY || 0 }}
      TURBO_ENV_MODE: ${{ vars.TURBO_ENV_MODE || 'strict' }}
      TURBO_TELEMETRY_DISABLED: 1
      YARN_CHECKSUM_BEHAVIOR: update
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
      - name: Get GitHub App User ID
        id: get_user_id
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.get_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Configure git
        run: |
          git config --global user.name ${{ steps.get_token.outputs.app-slug }}[bot]
          git config --global user.email ${{ steps.get_user_id.outputs.user-id }}+${{ steps.get_token.outputs.app-slug }}[bot]@users.noreply.github.com
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.get_token.outputs.token }}
          ref: ${{ env.REF_NAME }}
      - name: Set Yarn global folder
        env:
          YARN_GLOBAL_FOLDER: ${{ runner.temp }}/.yarn/berry
        run: echo "YARN_GLOBAL_FOLDER=$YARN_GLOBAL_FOLDER" >> .env
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: '**/yarn.lock'
      - name: Start Turbo Cache Server
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          cache-prefix: ${{ vars.TURBO_CACHE_PREFIX }}
      - name: Sync and update ${{ env.REF_NAME }} branch
        env:
          BASE_URL: ${{ inputs.base_url || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          git remote add base "$BASE_URL"
          for attempt in 1 2; do
            branch_start=$(git rev-parse HEAD)
            git fetch base main
            merge_status=0
            if git merge-base HEAD base/main >/dev/null 2>&1; then
              git merge base/main --no-commit --ff || merge_status=$?
            else
              git merge base/main --allow-unrelated-histories --squash || merge_status=$?
            fi
            deleted_paths=$(git status | awk '/deleted by us/ {print $4}')
            if [[ -n "$deleted_paths" ]]; then
              printf '%s\n' "$deleted_paths" | xargs -r git rm --
            fi
            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ -n "$conflicts" ]]; then
              echo "::error::The sync merge left unresolved conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            if [[ "$merge_status" -ne 0 && -z "$deleted_paths" ]]; then
              unexpected_deleted_paths=$(git status --short | awk 'substr($0, 1, 2) ~ /D/ {print substr($0, 4)}')
              echo "::error::The sync merge failed (status $merge_status)."
              if [[ -n "$unexpected_deleted_paths" ]]; then
                echo "::error::Unexpected deleted files requiring review:"
                printf '%s\n' "$unexpected_deleted_paths"
              else
                echo "::error::Inspect the merge output above for the cause."
              fi
              exit "$merge_status"
            fi
            yarn install
            if ! git diff-index --quiet HEAD; then
              git add .
              git commit --no-edit
            fi
            push_status=0
            push_output=$(git push --porcelain origin "HEAD:refs/heads/$REF_NAME" 2>&1) || push_status=$?
            printf '%s\n' "$push_output"
            if [[ "$push_status" -eq 0 ]]; then
              break
            fi
            if [[ "$attempt" -eq 2 ]] || ! grep -Eq '\[rejected\].*\((fetch first|non-fast-forward)\)' <<< "$push_output"; then
              exit "$push_status"
            fi
            git fetch origin "+refs/heads/$REF_NAME:refs/remotes/origin/$REF_NAME"
            if [[ "$(git rev-parse "origin/$REF_NAME")" == "$branch_start" ]]; then
              exit "$push_status"
            fi
            # Rebuild the sync from the new branch tip instead of force-pushing stale results.
            echo "::notice::The remote branch changed during sync; retrying once immediately."
            git checkout -B "$REF_NAME" "origin/$REF_NAME"
          done

  mirror:
    needs: sync
    if: inputs.mirror || (github.event_name == 'push' && vars.FORK_REF_NAME)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
      - name: Get GitHub App User ID
        id: get_user_id
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.get_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Configure git
        run: |
          git config --global user.name ${{ steps.get_token.outputs.app-slug }}[bot]
          git config --global user.email ${{ steps.get_user_id.outputs.user-id }}+${{ steps.get_token.outputs.app-slug }}[bot]@users.noreply.github.com
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.get_token.outputs.token }}
          ref: ${{ env.REF_NAME }}
      - name: Load mirror environment
        id: dotenv
        if: env.DOTENV_PRIVATE_KEY_CI && hashFiles('.env.ci') != ''
        uses: andreijiroh-dev/dotenvx-action@0ac31ac01536b0ed0f3ce29a833b47894c96d6ba # main
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}
        with:
          path: .env.ci
          key: ${{ env.DOTENV_PRIVATE_KEY_CI }}
      - name: Check mirror environment decryption
        if: steps.dotenv.outputs.DOTENV_DECRYPTION_FAILURE == 'true'
        run: |
          echo "::error::Mirror environment decryption failed."
          exit 1
      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ steps.dotenv.outputs.MIRROR_SSH_KEY || secrets.MIRROR_SSH_KEY }}
          known_hosts: ${{ steps.dotenv.outputs.MIRROR_HOST_KEY || secrets.MIRROR_HOST_KEY }}
      - name: Configure mirror upstream
        env:
          MIRROR_REPO: ${{ steps.dotenv.outputs.MIRROR_REPO || secrets.MIRROR_REPO }}
        run: git remote add mirror "$MIRROR_REPO"
      - name: Fetch mirror upstream
        run: git fetch mirror main
      - name: Switch to mirror/main
        run: git checkout -B mirror-main mirror/main
      - name: Merge synchronized branch into mirror/main
        run: git merge "origin/$REF_NAME"
      - name: Push to mirror upstream
        run: git push -u mirror mirror-main:main
