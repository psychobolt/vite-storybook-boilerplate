name: Renovate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5
        with:
          concurrent_skipping: always
          skip_after_successful_duplicate: false
          do_not_skip: '[]'
  renovate:
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: root
      DOCKER_USER_HOME: /home/ubuntu
      YARN_AFTER_INSTALL: ''
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Yarn global folder
        id: yarn_global_folder
        env:
          YARN_GLOBAL_FOLDER: ${{ runner.temp }}/.yarn/berry
        run: |
          echo "YARN_GLOBAL_FOLDER=$YARN_GLOBAL_FOLDER" >> .env
          echo "YARN_GLOBAL_FOLDER=$YARN_GLOBAL_FOLDER" >> $GITHUB_OUTPUT
        shell: bash
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Start Turbo Cache Server
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          cache-prefix: ${{ vars.TURBO_CACHE_PREFIX }}
      - name: Install dependencies
        run: yarn install
      - name: Build renovate config
        id: renovate_config
        run: |
          yarn workspace commons turbo run build
          yarn run-script renovate.config.ts > renovate.config.json
          yarn node -p "'version=' + require('renovate/package.json').version" >> "$GITHUB_OUTPUT"
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_DIR: ${{ env.DOCKER_USER_HOME }}
          RENOVATE_PRINT_CONFIG: true
          LOG_LEVEL: debug
        with:
          configurationFile: renovate.config.json
          renovate-version: ${{ steps.renovate_config.outputs.version }}
          token: ${{ steps.get_token.outputs.token }}
          docker-user: ${{ env.DOCKER_USER }}
          docker-volumes: |
            ${{ steps.yarn_global_folder.outputs.YARN_GLOBAL_FOLDER }}:${{ env.DOCKER_USER_HOME }}/.yarn/berry
          env-regex: "^(?:(RENOVATE_|YARN_)\\w+|LOG_LEVEL)$"
