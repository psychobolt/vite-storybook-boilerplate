name: ci

on:
  workflow_call:
    inputs:
      ref:
        type: string
      ref_name:
        type: string
      base_ref:
        type: string
      head_ref:
        type: string
      diff_count:
        type: string
  workflow_dispatch:
    inputs:
      base_ref:
        type: string
        description: The base ref to compare against for changes.
      head_ref:
        type: string
        description: The head ref to compare changes against for changes. If specified, it overrides the base_ref.
      diff_count:
        type: string
        description: The number of commits to consider for the diff.

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref_name || github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_VERBOSITY: ${{ vars.TURBO_VERBOSITY || 0 }}
      TURBO_ENV_MODE: ${{ vars.TURBO_ENV_MODE || 'strict' }}
      TURBO_TELEMETRY_DISABLED: 1
      YARN_ENABLE_HARDENED_MODE: 0
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref_name || github.ref }}
      - name: Set Yarn global folder
        env:
          YARN_GLOBAL_FOLDER: ${{ runner.temp }}/.yarn/berry
        run: echo "YARN_GLOBAL_FOLDER=$YARN_GLOBAL_FOLDER" >> .env
        shell: bash
      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Start Turbo Cache Server
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: ${{ vars.TURBO_CACHE_PREFIX }}
      - name: Install dependencies
        run: yarn install
      - name: Lint
        run: yarn turbo run //#lint --env-mode=${{ env.TURBO_ENV_MODE }} --verbosity=${{ env.TURBO_VERBOSITY }}
      - name: Install APM
        if: matrix.os == 'ubuntu-latest'
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: latest
          setup-only: true
      # microsoft/apm-action does not support win32; use APM's official installer. See: https://github.com/microsoft/apm-action/blame/d723bb64ed70c135bbaf87d126b721dd2dae0439/src/installer.ts#L12-L26
      - name: Install APM (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:APM_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'apm\bin'
          irm https://aka.ms/apm-windows | iex
          $apmRoot = Split-Path $env:APM_INSTALL_DIR -Parent
          Add-Content -Path $env:GITHUB_PATH -Value $env:APM_INSTALL_DIR
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $apmRoot 'current')
          & (Join-Path $env:APM_INSTALL_DIR 'apm.cmd') --version
      - name: Deploy agent setup
        run: apm install --frozen
      - name: Audit agent setup
        run: apm audit --ci --no-cache

  diff:
    name: List Updated Packages
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ inputs.base_ref || github.base_ref }}
      TURBO_GLOBAL_WARNING_DISABLED: 1
    outputs:
      package_names: ${{ steps.changes.outputs.package_names }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ inputs.diff_count || 2 }}
          ref: ${{ inputs.ref_name || github.ref }}
      - name: Fetch base branch
        if: env.BASE_REF != ''
        run: git fetch --depth=1 origin ${{ env.BASE_REF }}:base_branch
      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            release:
              - '.yarn/versions/**'
          base: ${{ inputs.head_ref || (env.BASE_REF && 'base_branch') || '' }}
          ref: ${{ inputs.ref_name }}
          initial-fetch-depth: ${{ inputs.diff_count || 2 }}
      - name: Install Turbo
        run: |
          TURBO_VERSION=$(jq -r .devDependencies.turbo package.json)
          echo "Installing $TURBO_VERSION"
          npm install -g turbo@$TURBO_VERSION
          turbo bin
          turbo --version
      - name: Start Turbo Cache Server
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: ${{ vars.TURBO_CACHE_PREFIX }}
      - name: Collect Turborepo Changes
        id: changes
        uses: 94726/action-turborepo-changes@6bb75425be5455ba39431196f12e246a2f37d375 # v1.1.1
        env:
          TURBO_TELEMETRY_DISABLED: 1
        with:
          from: ${{ inputs.head_ref || (env.BASE_REF && 'base_branch') || 'HEAD~1' }}

  apps:
    needs: diff
    uses: ./.github/workflows/apps.yml
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      ref_name: ${{ inputs.ref_name }}
      base_ref: ${{ inputs.base_ref || github.base_ref }}
      package_names: ${{ needs.diff.outputs.package_names }}

  packages:
    needs: diff
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read
      deployments: write
      issues: write
      packages: write
      pull-requests: write
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      ref_name: ${{ inputs.ref_name }}
      package_names: ${{ needs.diff.outputs.package_names }}
      release: ${{ needs.diff.outputs.release }}

  release:
    needs: [diff, test, apps, packages]
    if: always() && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'failure') && contains(needs.*.outputs.release, 'true')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      ref_name: ${{ inputs.ref_name }}
      head_ref: ${{ inputs.head_ref }}
